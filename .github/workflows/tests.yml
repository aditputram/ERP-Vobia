name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
        working-directory: app
        env:
          VOBIA_USE_SQLITE: "1"
          DJANGO_DEBUG: "1"
      - run: python manage.py test --parallel auto
        working-directory: app
        env:
          VOBIA_USE_SQLITE: "1"
          DJANGO_DEBUG: "1"
