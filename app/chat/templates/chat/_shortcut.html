<button class="chat-shortcut" type="button" aria-label="Buka Messages" aria-haspopup="dialog" data-chat-popup-open data-chat-unread="{{ chat_unread_count }}" data-live-status-url="{% url 'dashboard:live_status' %}">
    <span class="chat-shortcut-icon" aria-hidden="true"></span>
    {% if chat_unread_count %}<span class="chat-shortcut-badge" data-chat-shortcut-badge>{% if chat_unread_count > 99 %}99+{% else %}{{ chat_unread_count }}{% endif %}</span>{% endif %}
</button>
<dialog class="chat-popup" aria-label="Messages" data-chat-popup>
    <header>
        <strong>Messages</strong>
        <div class="chat-popup-actions">
            <button class="chat-push-button" type="button" data-push-enable data-config-url="{% url 'chat:push_config' %}" data-subscribe-url="{% url 'chat:push_subscribe' %}" data-unsubscribe-url="{% url 'chat:push_unsubscribe' %}">Aktifkan notif</button>
            <button type="button" aria-label="Tutup Messages" data-chat-popup-close>×</button>
        </div>
    </header>
    <form hidden>{% csrf_token %}</form>
    <iframe title="Messages" data-src="{% url 'chat:inbox' %}?embed=1" data-chat-popup-frame></iframe>
</dialog>
<script>
(() => {
    const popup = document.querySelector('[data-chat-popup]');
    const open = document.querySelector('[data-chat-popup-open]');
    if (!popup || !open) return;
    const frame = popup.querySelector('[data-chat-popup-frame]');
    open.addEventListener('click', () => {
        if (!frame.dataset.loaded) { frame.src = frame.dataset.src; frame.dataset.loaded = '1'; }
        popup.showModal();
    });
    popup.querySelector('[data-chat-popup-close]').addEventListener('click', () => popup.close());
    popup.addEventListener('click', event => { if (event.target === popup) popup.close(); });

    const updateBadge = count => {
        let badge = open.querySelector('[data-chat-shortcut-badge]');
        if (!count) { badge?.remove(); return; }
        if (!badge) {
            badge = document.createElement('span');
            badge.className = 'chat-shortcut-badge';
            badge.dataset.chatShortcutBadge = '';
            open.append(badge);
        }
        badge.textContent = count > 99 ? '99+' : count;
    };
    const updateNotifications = data => {
        const notificationOpen = document.querySelector('[data-rnd-notification-open]');
        const notificationPopup = document.querySelector('[data-rnd-notification-popup]');
        if (!notificationOpen || !notificationPopup) return;
        let badge = notificationOpen.querySelector('[data-rnd-notification-badge]');
        if (!data.rnd_unread_count) badge?.remove();
        else {
            if (!badge) {
                badge = document.createElement('span');
                badge.className = 'rnd-notification-badge';
                badge.dataset.rndNotificationBadge = '';
                notificationOpen.append(badge);
            }
            badge.textContent = data.rnd_unread_count > 99 ? '99+' : data.rnd_unread_count;
        }
        notificationPopup.querySelector('[data-rnd-unread-copy]').textContent = data.rnd_unread_count;
        notificationPopup.querySelector('[data-rnd-mark-all]').hidden = !data.rnd_unread_count;
        const list = notificationPopup.querySelector('[data-rnd-notification-list]');
        list.replaceChildren();
        const appendNotification = notification => {
            const item = document.createElement('a');
            item.className = `rnd-notification-item${notification.unread ? ' is-unread' : ''}${notification.category === 'approval' ? ' rnd-approval-item' : ''}`;
            item.href = notification.open_url;
            item.dataset.notificationCategory = notification.category;
            const dot = document.createElement('span');
            dot.className = 'rnd-notification-dot';
            dot.setAttribute('aria-hidden', 'true');
            const content = document.createElement('span');
            const title = document.createElement('strong');
            title.textContent = notification.title;
            const message = document.createElement('span');
            message.textContent = notification.message;
            const time = document.createElement('time');
            time.textContent = notification.created_at;
            content.append(title, message, time);
            item.append(dot, content);
            list.append(item);
        };
        data.rnd_approvals.forEach(approval => appendNotification({...approval, category: 'approval'}));
        data.rnd_notifications.forEach(appendNotification);
        const empty = document.createElement('div');
        empty.className = 'rnd-notification-empty';
        empty.dataset.rndNotificationEmpty = '';
        const emptyTitle = document.createElement('strong');
        const emptyCopy = document.createElement('span');
        empty.append(emptyTitle, emptyCopy);
        list.append(empty);
        notificationPopup.querySelector('[data-rnd-approval-count]').textContent = data.rnd_approval_count;
        notificationPopup.dispatchEvent(new CustomEvent('rnd-notifications-updated'));
    };
    let fetching = false;
    const refreshStatus = async () => {
        if (fetching || document.hidden) return;
        fetching = true;
        try {
            const response = await fetch(open.dataset.liveStatusUrl, {headers: {'X-Requested-With': 'XMLHttpRequest'}});
            if (!response.ok) return;
            const data = await response.json();
            const previous = Number(open.dataset.chatUnread || 0);
            updateBadge(data.chat_unread_count);
            updateNotifications(data);
            if (data.chat_unread_count > previous) {
                if (!popup.open) delete frame.dataset.loaded;
                else if (frame.dataset.loaded) {
                    const body = frame.contentDocument?.querySelector('#id_body');
                    const attachment = frame.contentDocument?.querySelector('input[type="file"]');
                    if (!body?.value && !attachment?.files?.length) frame.contentWindow.location.reload();
                }
            }
            open.dataset.chatUnread = data.chat_unread_count;
        } catch (_error) {
            // A temporary network failure is retried on the next poll.
        } finally {
            fetching = false;
        }
    };
    setInterval(refreshStatus, 5000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshStatus(); });
})();
</script>
<script>
(() => {
    const popup = document.querySelector('[data-chat-popup]');
    const button = popup?.querySelector('[data-push-enable]');
    if (!button) return;
    const csrfToken = popup.querySelector('input[name="csrfmiddlewaretoken"]')?.value;
    const supported = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
    let currentSubscription = null;
    const decodeKey = value => {
        const padding = '='.repeat((4 - value.length % 4) % 4);
        const raw = atob((value + padding).replace(/-/g, '+').replace(/_/g, '/'));
        return Uint8Array.from([...raw].map(character => character.charCodeAt(0)));
    };
    const setActive = subscription => {
        currentSubscription = subscription;
        button.textContent = 'Nonaktifkan notifikasi';
        button.classList.add('is-active');
        button.disabled = false;
    };
    const setInactive = () => {
        currentSubscription = null;
        button.textContent = 'Aktifkan notif';
        button.classList.remove('is-active');
        button.disabled = false;
    };
    const subscribe = async requestPermission => {
        if (!supported) {
            button.textContent = 'Browser belum mendukung';
            button.disabled = true;
            return;
        }
        if (requestPermission && Notification.permission === 'default') {
            await Notification.requestPermission();
        }
        if (Notification.permission !== 'granted') {
            button.textContent = Notification.permission === 'denied' ? 'Notif laptop diblokir' : 'Aktifkan notif';
            return;
        }
        button.disabled = true;
        button.textContent = 'Mengaktifkan…';
        try {
            const configResponse = await fetch(button.dataset.configUrl, {headers: {'X-Requested-With': 'XMLHttpRequest'}});
            const config = await configResponse.json();
            if (!config.enabled) throw new Error('Web Push belum dikonfigurasi.');
            const registration = await navigator.serviceWorker.register('/service-worker.js');
            const serverKey = decodeKey(config.public_key);
            let subscription = await registration.pushManager.getSubscription();
            const currentKey = subscription?.options?.applicationServerKey;
            if (subscription && currentKey) {
                const currentBytes = new Uint8Array(currentKey);
                const sameKey = currentBytes.length === serverKey.length && currentBytes.every((value, index) => value === serverKey[index]);
                if (!sameKey) {
                    await subscription.unsubscribe();
                    subscription = null;
                }
            }
            if (!subscription) {
                subscription = await registration.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: serverKey,
                });
            }
            const response = await fetch(button.dataset.subscribeUrl, {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrfToken},
                body: JSON.stringify(subscription.toJSON()),
            });
            if (!response.ok) throw new Error(`Subscription gagal disimpan (HTTP ${response.status}).`);
            setActive(subscription);
        } catch (error) {
            button.disabled = false;
            button.textContent = 'Coba aktifkan lagi';
            console.warn(error);
        }
    };
    const unsubscribe = async () => {
        if (!currentSubscription) return;
        button.disabled = true;
        button.textContent = 'Menonaktifkan…';
        try {
            await currentSubscription.unsubscribe();
            const response = await fetch(button.dataset.unsubscribeUrl, {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrfToken},
                body: JSON.stringify({endpoint: currentSubscription.endpoint}),
            });
            if (!response.ok) throw new Error('Subscription gagal dihapus.');
            setInactive();
        } catch (error) {
            button.disabled = false;
            button.textContent = 'Coba nonaktifkan lagi';
            console.warn(error);
        }
    };
    if (!supported) {
        button.textContent = 'Browser belum mendukung';
        button.disabled = true;
    } else if (Notification.permission === 'denied') {
        button.textContent = 'Notif laptop diblokir';
        button.disabled = true;
    } else if (Notification.permission === 'granted') {
        navigator.serviceWorker.getRegistration('/').then(registration =>
            registration?.pushManager.getSubscription()
        ).then(subscription => {
            if (subscription) subscribe(false);
        }).catch(console.warn);
    }
    button.addEventListener('click', () => button.classList.contains('is-active') ? unsubscribe() : subscribe(true));
})();
</script>
