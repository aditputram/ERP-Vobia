{% if page.paginator.num_pages > 1 %}<nav class="pagination"><span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span><div>{% if page.has_previous %}<a class="secondary-button compact" href="?page={{ page.previous_page_number }}">Previous</a>{% endif %}{% if page.has_next %}<a class="secondary-button compact" href="?page={{ page.next_page_number }}">Next</a>{% endif %}</div></nav>{% endif %}
